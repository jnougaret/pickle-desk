name: Release Pickle Desk desktop installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm run build && npm run tauri:smoke
      - run: npm run tauri:build:mac
      - name: Prepare macOS release artifact
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' ! -name 'rw.*' -print -quit)"
          test -n "$dmg_path"
          mkdir -p release/macos
          cp "$dmg_path" release/macos/Pickle-Desk-macOS-universal.dmg
          shasum -a 256 release/macos/Pickle-Desk-macOS-universal.dmg > release/macos/Pickle-Desk-macOS-universal.dmg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: release/macos/*

  windows:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
      # This is the immutable Partner Center package identity reserved for the
      # existing Store app. The visible display name is Pickle Desk.
      MSIX_PACKAGE_NAME: JoshuaNougaret.TournamentDesk
      MSIX_PUBLISHER: CN=2432AE4E-9706-4832-9DD7-B03ACFB13176
      MSIX_PUBLISHER_DISPLAY_NAME: Joshua Nougaret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Import Windows signing certificate when configured
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          $cert = Get-PfxCertificate -FilePath certificate/certificate.pfx -Password $password
          $timestampUrl = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = $timestampUrl } } } | ConvertTo-Json -Depth 5
          Set-Content -Path src-tauri/tauri.windows.conf.json -Value $config
      - run: npm run build
      - run: npm run tauri:smoke
      - name: Build signed Windows installer
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        run: npm run tauri:build:windows -- --config src-tauri/tauri.windows.conf.json
      - name: Build unsigned Windows installer
        if: ${{ env.WINDOWS_CERTIFICATE == '' }}
        run: npm run tauri:build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
      - name: Build Microsoft Store MSIX package
        if: ${{ env.MSIX_PACKAGE_NAME != '' && env.MSIX_PUBLISHER != '' && env.MSIX_PUBLISHER_DISPLAY_NAME != '' }}
        run: npm run tauri:package:msix
      - name: Upload Microsoft Store MSIX package
        if: ${{ env.MSIX_PACKAGE_NAME != '' && env.MSIX_PUBLISHER != '' && env.MSIX_PUBLISHER_DISPLAY_NAME != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: src-tauri/target/release/bundle/msix/*.msix

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Prepare published release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          macos_dmg="$(find release-artifacts/macos-universal -type f -name 'Pickle-Desk-macOS-universal.dmg' -print -quit)"
          test -n "$macos_dmg"
          cp "$macos_dmg" release-assets/Pickle-Desk-macOS-universal.dmg

          windows_setup="$(find release-artifacts/windows-nsis -type f -name '*-setup.exe' -print -quit)"
          test -n "$windows_setup"
          cp "$windows_setup" release-assets/Pickle-Desk-windows-setup.exe

          msix_path="$(find release-artifacts -type f -name '*.msix' -print -quit || true)"
          if [ -n "$msix_path" ]; then
            cp "$msix_path" release-assets/Pickle-Desk-windows.msix
          fi

          sha256sum release-assets/Pickle-Desk-macOS-universal.dmg release-assets/Pickle-Desk-windows-setup.exe > release-assets/SHA256SUMS.txt
          if [ -f release-assets/Pickle-Desk-windows.msix ]; then
            sha256sum release-assets/Pickle-Desk-windows.msix >> release-assets/SHA256SUMS.txt
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "The Pickle Desk PWA for Android and iPadOS is available at https://pickledesk.joshuanougaret.com/. The PWA is deployed through Cloudflare Pages rather than uploaded as a release binary." \
            --generate-notes \
            release-assets/*
