name: Release desktop installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - name: Import Developer ID certificate when configured
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          echo "APPLE_SIGNING_IDENTITY=$(security find-identity -v -p codesigning build.keychain | awk -F'\"' '/Developer ID Application/{print $2; exit}')" >> "$GITHUB_ENV"
      - run: npm run build && npm run tauri:smoke
      - run: npm run tauri:build:mac
      - name: Prepare macOS release artifact
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -type f -name '*.dmg' ! -name 'rw.*' -print -quit)"
          test -n "$dmg_path"
          mkdir -p release/macos
          cp "$dmg_path" release/macos/Tournament-Desk-macOS-universal.dmg
          shasum -a 256 release/macos/Tournament-Desk-macOS-universal.dmg > release/macos/Tournament-Desk-macOS-universal.dmg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: release/macos/*

  windows:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Import Windows signing certificate when configured
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          $cert = Get-PfxCertificate -FilePath certificate/certificate.pfx -Password $password
          $timestampUrl = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = $timestampUrl } } } | ConvertTo-Json -Depth 5
          Set-Content -Path src-tauri/tauri.windows.conf.json -Value $config
      - run: npm run build
      - run: npm run tauri:smoke
      - name: Build signed Windows installer
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        run: npm run tauri:build:windows -- --config src-tauri/tauri.windows.conf.json
      - name: Build unsigned Windows installer
        if: ${{ env.WINDOWS_CERTIFICATE == '' }}
        run: npm run tauri:build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Prepare published release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          macos_dmg="$(find release-artifacts/macos-universal -type f -name 'Tournament-Desk-macOS-universal.dmg' -print -quit)"
          test -n "$macos_dmg"
          cp "$macos_dmg" release-assets/Tournament-Desk-macOS-universal.dmg

          windows_setup="$(find release-artifacts/windows-nsis -type f -name '*-setup.exe' -print -quit)"
          test -n "$windows_setup"
          cp "$windows_setup" release-assets/Tournament-Desk-windows-setup.exe

          sha256sum release-assets/Tournament-Desk-macOS-universal.dmg release-assets/Tournament-Desk-windows-setup.exe > release-assets/SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release-assets/*
